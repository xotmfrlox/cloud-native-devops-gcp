cat > .github/workflows/deploy.yml <<'EOF'
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Install kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Create kind cluster
        run: |
          kind create cluster --name devops
          kubectl get nodes

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image from GHCR
        run: |
          docker pull ghcr.io/xotmfrlox/cloud-native-devops-gcp:latest
          docker images | grep cloud-native-devops-gcp

      - name: Load image into kind
        run: |
          kind load docker-image ghcr.io/xotmfrlox/cloud-native-devops-gcp:latest --name devops

      - name: Patch deployment for kind
        run: |
          sed -i 's/imagePullPolicy: Always/imagePullPolicy: IfNotPresent/' k8s/deployment.yaml
          cat k8s/deployment.yaml

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/
          kubectl get pods
          kubectl rollout status deployment/devops-app --timeout=180s

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get all
          kubectl describe deployment devops-app
          kubectl get pods
          POD_NAME=$(kubectl get pods -l app=devops-app -o jsonpath='{.items[0].metadata.name}')
          kubectl describe pod $POD_NAME
          kubectl logs $POD_NAME --all-containers=true || true
EOF
