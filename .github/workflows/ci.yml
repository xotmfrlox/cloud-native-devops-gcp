name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Docker build
        run: docker build -t devops-app:ci -f docker/Dockerfile .

  deploy-to-kind:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        run: |
          kind create cluster --name devops
          kubectl get nodes

      - name: Build Docker image (tag matches Deployment)
        run: |
          docker build -t devops-app:1.0 -f docker/Dockerfile .
          docker images | grep devops-app

      - name: Load image into kind
        run: |
          kind load docker-image devops-app:1.0 --name devops

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/devops-app --timeout=120s
          kubectl get pods
          kubectl get svc

      - name: Smoke test via port-forward
        run: |
          kubectl port-forward svc/devops-app 8080:80 >/tmp/pf.log 2>&1 &
          sleep 3
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ready

